<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MindX Netflix Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* giữ nguyên toàn bộ CSS của bạn */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#111;color:#fff;overflow-x:hidden;}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 5%;z-index:1000;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);}
.logo{color:#e50914;font-size:28px;font-weight:bold;}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-size:14px;}
.hero{height:100vh;background:url('https://image.tmdb.org/t/p/original/8uVKfOJUhmybNsVh089EqLHUYEG.jpg') center/cover no-repeat;position:relative;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#141414 10%,rgba(0,0,0,.2));}
.hero-content{position:absolute;bottom:30%;left:5%;max-width:500px;z-index:2;}
.hero h1{font-size:48px;margin-bottom:15px;}
.hero p{color:#ddd;line-height:1.6;margin-bottom:20px;}
.hero button{padding:10px 25px;border:none;font-size:16px;border-radius:4px;cursor:pointer;}
.play{background:#fff;color:#000}
.info{background:rgba(109,109,110,.7);color:#fff}
.row{margin-bottom:60px;}
.row h2{font-size:20px;font-weight:600;padding-left:5%;margin-bottom:15px;}
.movies{display:flex;gap:30px;overflow-x:auto;padding:20px 5%;}
.movies::-webkit-scrollbar{display:none}
.movie,.top-item{min-width:240px;height:135px;background-size:cover;background-position:center;border-radius:8px;flex-shrink:0;transition:transform .3s ease;}
.movie:hover,.top-item:hover{transform:scale(1.2);z-index:10;}
.top-item .rank{position:absolute;left:-18px;bottom:-12px;font-size:90px;font-weight:900;color:#111;-webkit-text-stroke:2px #fff;position: relative;}
footer{text-align:center;padding:40px;color:#777;}
</style>
</head>

<body>

<header>
  <div class="logo">MINDX</div>
  <nav>
    <a href="#">Home</a>
    <a href="contact.html">Liên hệ</a>
    <a href="#">Movies</a>
    <a href="#">My List</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p id="hero-desc"></p>
    <button class="play">▶ Play</button>
    <button class="info">More Info</button>
  </div>
</div>

<!-- TRENDING -->
<div class="row">
  <h2>Trending Now</h2>
  <div class="movies" id="trending"></div>
</div>

<!-- ACTION -->
<div class="row">
  <h2>Action Movies</h2>
  <div class="movies" id="action"></div>
</div>

<footer>
© 2026 MindX – Đào Hải Phong
</footer>

<script src="movies.js"></script>
<script src="trangchu.js"></script>
</body>
</html>
